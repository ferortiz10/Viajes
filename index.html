<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A6B48">
<title>Viaje</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Titillium+Web:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2EF; --surface:#FFFFFF; --sunk:#E1E8E3; --line:#CBD6CF; --fg:#13241C; --muted:#56685E;
  --sign:#0A6B48; --on-sign:#FFFFFF; --sign-soft:#D7EBE1;
  --amber:#B97800; --amber-soft:#FBEFD2; --red:#B4341F; --red-soft:#F7DED8;
  --f-display:"Titillium Web","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0F1713; --surface:#18231D; --sunk:#111B16; --line:#2C3B33; --fg:#E6EFE9; --muted:#9DB0A5;
  --sign:#2E9C6F; --sign-soft:#1D3A2C; --amber:#E0A23A; --amber-soft:#3A2E14; --red:#E07563; --red-soft:#3D1F1A;
}}
*{box-sizing:border-box} html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.45 var(--f-body);min-height:100dvh;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.15}
button,input,textarea,select{font:inherit;color:inherit}
header.top{background:var(--sign);color:var(--on-sign);padding:calc(10px + env(safe-area-inset-top)) 16px 14px;display:flex;align-items:center;gap:10px}
header.top h1{font-size:1.35rem;flex:1}
header.top .who{font-size:.85rem;opacity:.9}
main{max-width:640px;margin:0 auto;padding:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 16px;font-weight:700;cursor:pointer;text-decoration:none;color:var(--fg);min-height:46px}
.btn.pri{background:var(--sign);color:var(--on-sign);border-color:var(--sign)}
.btn.big{width:100%;font-size:1.15rem;min-height:64px;border-radius:16px}
.btn:disabled{opacity:.55}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row > .btn{flex:1}
.field{margin:12px 0}
.field label,.lbl{display:block;font-size:.8rem;font-weight:700;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em}
.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:var(--sunk);border-radius:12px;padding:12px;min-height:46px}
.muted{color:var(--muted);font-size:.9rem}
.cands{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.cand{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--sunk);border-radius:12px;padding:10px 12px;cursor:pointer;width:100%}
.cand[aria-pressed="true"]{border-color:var(--sign);background:var(--sign-soft);box-shadow:inset 0 0 0 1px var(--sign)}
.cand b{display:block} .cand small{color:var(--muted)}
.cand .d{margin-left:auto;font-size:.8rem;color:var(--muted);white-space:nowrap}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.thumbs img{width:84px;height:84px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.thumbs .th{position:relative}
.thumbs .th button{position:absolute;top:4px;right:4px;border:0;border-radius:50%;width:26px;height:26px;background:rgba(0,0,0,.6);color:#fff;cursor:pointer}
.lug{display:flex;gap:12px;align-items:flex-start}
.lug img{width:72px;height:72px;border-radius:10px;object-fit:cover;flex:none}
.lug .ph{width:72px;height:72px;border-radius:10px;background:var(--sunk);display:grid;place-items:center;flex:none;font-size:1.6rem}
.lug h3{font-size:1.05rem}
.day{font-family:var(--f-display);font-weight:700;color:var(--muted);margin:18px 2px 8px;text-transform:capitalize}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav.tabs button{flex:1;border:0;background:none;padding:10px 4px 12px;font-size:.8rem;font-weight:700;color:var(--muted);cursor:pointer}
nav.tabs button[aria-current="page"]{color:var(--sign)}
nav.tabs .i{display:block;font-size:1.35rem}
.toast{position:fixed;left:16px;right:16px;bottom:calc(88px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;background:#13241C;color:#fff;border-radius:12px;padding:12px 14px;z-index:20;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.status{font-size:.9rem;padding:8px 12px;border-radius:10px;background:var(--amber-soft);color:var(--fg);margin-top:8px}
.ok{background:var(--sign-soft)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
pre{white-space:pre-wrap;font-size:.8rem;background:var(--sunk);padding:10px;border-radius:10px;overflow:auto}
[hidden]{display:none!important}
</style>
</head>
<body>
<header class="top"><h1 id="titulo">Viaje</h1><span class="who" id="who"></span></header>
<main id="app"><p class="muted">Cargando…</p></main>
<nav class="tabs" id="tabs" hidden>
  <button data-v="aca"><span class="i">📍</span>Estoy acá</button>
  <button data-v="lugares"><span class="i">🗺</span>Lugares</button>
  <button data-v="ajustes"><span class="i">⚙️</span>Ajustes</button>
</nav>
<input type="file" id="fCam" accept="image/*" capture="environment" class="vh" tabindex="-1">
<input type="file" id="fGal" accept="image/*" multiple class="vh" tabindex="-1">
<div class="toast" id="toast" role="status" hidden></div>

<script type="module">
const FB = "https://www.gstatic.com/firebasejs/10.12.2/";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let tT; const toast = (m, ms=3800) => { const t=$("toast"); t.textContent=m; t.hidden=false; clearTimeout(tT); tT=setTimeout(()=>t.hidden=true, ms); };
const ls = { get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }, set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} } };
const hoyISO = () => { const d=new Date(); return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10); };
const ahoraHM = () => new Date().toTimeString().slice(0,5);

const S = { fb:null, user:null, trip:null, tripId:null, mapsKey:"", lugares:[], view:"aca",
  aca:{ pos:null, cands:[], elegido:null, fotos:[], nombre:"", direccion:"", ciudad:"", nota:"", buscando:false, compartido:"" } };

if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});

// ---------- configuración inicial (la pega el usuario; nada secreto en el código) ----------
function leerConfigDeLink(){
  const m = location.hash.match(/cfg=([^&]+)/); if(!m) return;
  try{ const c = JSON.parse(decodeURIComponent(escape(atob(m[1])))); if(c.firebase) { ls.set("cfg", c); history.replaceState(null, "", location.pathname); toast("Configuración cargada"); } }catch(e){}
}
function parsearFirebaseConfig(txt){
  // acepta el bloque tal cual lo muestra Firebase: const firebaseConfig = { apiKey: "...", ... };
  const o = {}; for(const k of ["apiKey","authDomain","projectId","storageBucket","messagingSenderId","appId"]){ const m = txt.match(new RegExp(k+`\\s*["']?\\s*:\\s*["']([^"']+)["']`)); if(m) o[k]=m[1]; }
  return o.apiKey && o.projectId && o.appId ? o : null;
}
function pantallaConfig(){
  $("tabs").hidden = true;
  $("app").innerHTML = `<div class="card"><h2>Configurar la app</h2>
    <p class="muted">Solo la primera vez en cada celular. Si Fernando ya la configuró, pedile el <b>link de configuración</b> (en Ajustes) y abrilo: se completa solo.</p>
    <div class="field"><label for="cFb">Bloque firebaseConfig (copialo de la consola de Firebase)</label><textarea id="cFb" rows="7" placeholder='const firebaseConfig = { apiKey: "…", authDomain: "…", projectId: "…", … };'></textarea></div>
    <div class="field"><label for="cMaps">Clave de Google Maps (Places API)</label><input id="cMaps" autocomplete="off" placeholder="AIza…"></div>
    <button class="btn pri big" id="cOk">Guardar y entrar</button></div>`;
  $("cOk").onclick = () => {
    const f = parsearFirebaseConfig($("cFb").value); if(!f){ toast("No reconozco el bloque de Firebase. Copialo completo."); return; }
    ls.set("cfg", {firebase:f, maps:$("cMaps").value.trim()}); location.reload();
  };
}

// ---------- Firebase ----------
async function iniciarFirebase(cfg){
  const [{initializeApp}, auth, fs] = await Promise.all([import(FB+"firebase-app.js"), import(FB+"firebase-auth.js"), import(FB+"firebase-firestore.js")]);
  const app = initializeApp(cfg.firebase);
  let db; try{ db = fs.initializeFirestore(app, {localCache: fs.persistentLocalCache({tabManager: fs.persistentMultipleTabManager()})}); }catch(e){ db = fs.getFirestore(app); }
  S.fb = {app, auth, fs, db, a: auth.getAuth(app)};
  S.mapsKey = cfg.maps || "";
  try{ await auth.getRedirectResult(S.fb.a); }catch(e){ if(e.code !== "auth/no-auth-event") toast("Login: "+(e.code||e.message)); }
  auth.onAuthStateChanged(S.fb.a, async u => { S.user = u; if(!u) return pantallaLogin(); $("who").textContent = u.displayName?.split(" ")[0] || u.email; await cargarViaje(); });
}
function pantallaLogin(){
  $("tabs").hidden = true; $("who").textContent = "";
  $("app").innerHTML = `<div class="card"><h2>Entrar</h2><p class="muted">Entrá con tu cuenta de Google. Fernando y Rosana ven el mismo viaje.</p><button class="btn pri big" id="lg">Entrar con Google</button></div>`;
  $("lg").onclick = async () => {
    const {GoogleAuthProvider, signInWithPopup, signInWithRedirect} = S.fb.auth; const p = new GoogleAuthProvider();
    try{ await signInWithPopup(S.fb.a, p); }catch(e){ if(/popup/.test(e.code||"")) await signInWithRedirect(S.fb.a, p); else toast("No se pudo entrar: "+(e.code||e.message)); }
  };
}
async function cargarViaje(){
  const {doc, getDoc, setDoc, collection, query, where, getDocs, onSnapshot, orderBy, serverTimestamp} = S.fb.fs;
  const email = S.user.email.toLowerCase();
  let id = ls.get("tripId");
  if(!id){ const q = await getDocs(query(collection(S.fb.db, "viajes"), where("emails", "array-contains", email))); if(!q.empty) id = q.docs[0].id; }
  if(!id){
    $("app").innerHTML = `<div class="card"><h2>Nuevo viaje</h2><div class="field"><label for="nV">Nombre</label><input id="nV" value="Italia 2026"></div>
      <div class="field"><label for="nE">Mail de Google de tu compañera o compañero de viaje</label><input id="nE" type="email" placeholder="rosana@gmail.com"></div>
      <div class="row"><div class="field" style="flex:1"><label for="nD">Desde</label><input id="nD" type="date" value="2026-10-29"></div><div class="field" style="flex:1"><label for="nH">Hasta</label><input id="nH" type="date" value="2026-12-01"></div></div>
      <button class="btn pri big" id="nOk">Crear viaje</button></div>`;
    $("tabs").hidden = true;
    $("nOk").onclick = async () => {
      const emails = [email, ...$("nE").value.split(/[,\s]+/).map(x=>x.trim().toLowerCase()).filter(Boolean)];
      const ref = doc(collection(S.fb.db, "viajes"));
      await setDoc(ref, {nombre:$("nV").value.trim()||"Viaje", emails:[...new Set(emails)], desde:$("nD").value, hasta:$("nH").value, owner:S.user.uid, creado:serverTimestamp()});
      ls.set("tripId", ref.id); cargarViaje();
    };
    return;
  }
  let snap; try{ snap = await getDoc(doc(S.fb.db, "viajes", id)); }catch(e){ snap = null; }
  if(!snap || !snap.exists()){ ls.set("tripId", null); toast("No tenés acceso a ese viaje."); return cargarViaje(); }
  S.tripId = id; ls.set("tripId", id); S.trip = {id, ...snap.data()}; $("titulo").textContent = S.trip.nombre;
  onSnapshot(query(collection(S.fb.db, "viajes", id, "lugares"), orderBy("ts","desc")), qs => { S.lugares = qs.docs.map(d=>({id:d.id, ...d.data()})); if(S.view==="lugares" && !S.editId) render(); });
  $("tabs").hidden = false;
  await revisarCompartido();
  irA(S.view);
}

// ---------- navegación ----------
function irA(v){ S.view = v; S.editId = null; for(const b of $("tabs").querySelectorAll("button")) b.setAttribute("aria-current", b.dataset.v===v ? "page" : "false"); render(); if(v==="aca" && !S.aca.pos) ubicar(); }
$("tabs").addEventListener("click", e => { const b = e.target.closest("button[data-v]"); if(b) irA(b.dataset.v); });
function render(){ ({aca:vistaAca, lugares:vistaLugares, ajustes:vistaAjustes})[S.view](); }

// ---------- ubicación y lugares cercanos (Google Places API New) ----------
const distM = (a,b) => { const R=6371e3, r=x=>x*Math.PI/180; const dLa=r(b.lat-a.lat), dLo=r(b.lng-a.lng); const h=Math.sin(dLa/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLo/2)**2; return 2*R*Math.asin(Math.sqrt(h)); };
const CAMPOS = "places.id,places.displayName,places.formattedAddress,places.shortFormattedAddress,places.location,places.googleMapsUri,places.primaryTypeDisplayName,places.addressComponents";
function ciudadDeComp(p){ const c = p.addressComponents||[]; const f = t => (c.find(x=>(x.types||[]).includes(t))||{}).longText || ""; return f("locality") || f("postal_town") || f("administrative_area_level_3") || f("administrative_area_level_2"); }
const aCand = (p, pos) => ({ id:p.id, nombre:p.displayName?.text||"", direccion:p.shortFormattedAddress||p.formattedAddress||"", ciudad:ciudadDeComp(p), tipo:p.primaryTypeDisplayName?.text||"", lat:p.location?.latitude, lng:p.location?.longitude, maps:p.googleMapsUri||"", dist: pos && p.location ? Math.round(distM(pos, {lat:p.location.latitude, lng:p.location.longitude})) : null });
async function places(path, body){
  if(!S.mapsKey) throw Object.assign(new Error("sin clave"), {code:"nokey"});
  const r = await fetch("https://places.googleapis.com/v1/"+path, {method:"POST", headers:{"Content-Type":"application/json","X-Goog-Api-Key":S.mapsKey,"X-Goog-FieldMask":CAMPOS}, body:JSON.stringify({languageCode:"it", ...body})});
  const j = await r.json().catch(()=>({})); if(!r.ok) throw Object.assign(new Error(j.error?.message||r.status), {code:"api"}); return j.places||[];
}
async function cercanos(pos){
  const radios = [40, 120, 350];
  for(const radius of radios){
    const ps = await places("places:searchNearby", {maxResultCount:10, rankPreference:"DISTANCE", locationRestriction:{circle:{center:{latitude:pos.lat, longitude:pos.lng}, radius}}});
    if(ps.length >= 3 || radius === radios.at(-1)) return ps.map(p=>aCand(p,pos));
  }
}
async function buscarTexto(q, pos){
  const body = {textQuery:q, maxResultCount:6}; if(pos) body.locationBias = {circle:{center:{latitude:pos.lat, longitude:pos.lng}, radius:3000}};
  return (await places("places:searchText", body)).map(p=>aCand(p,pos));
}
// dirección escrita a mano: se busca solo para tener coordenadas y ciudad; se guarda el texto tal cual se escribió
async function geocodificar(texto, pos){ try{ const r = await buscarTexto(texto, pos); return r[0] ? {texto, lat:r[0].lat, lng:r[0].lng, ciudad:r[0].ciudad} : {texto, lat:null, lng:null, ciudad:""}; }catch(e){ return {texto, lat:null, lng:null, ciudad:""}; } }
function consultaDir(dir, ciudad){ return ciudad && !dir.toLowerCase().includes(ciudad.toLowerCase()) ? `${dir}, ${ciudad}` : dir; }
const mapsDeDir = q => `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`;
function ubicar(){
  const A = S.aca; if(!navigator.geolocation){ A.err = "Este navegador no da la ubicación."; return render(); }
  A.buscando = true; A.err = ""; render();
  navigator.geolocation.getCurrentPosition(async p => {
    A.pos = {lat:+p.coords.latitude.toFixed(6), lng:+p.coords.longitude.toFixed(6), acc:Math.round(p.coords.accuracy)};
    await sugerir(); A.buscando = false; render();
  }, e => { A.buscando = false; A.err = e.code===1 ? "No diste permiso de ubicación. Activalo en el candado de la barra o en Ajustes del celular." : "No se pudo obtener la ubicación."; render(); },
  {enableHighAccuracy:true, timeout:20000, maximumAge:30000});
}
async function sugerir(){
  const A = S.aca; if(!A.pos) return;
  try{ A.cands = await cercanos(A.pos); if(!A.elegido && !A.dirManual && A.cands[0] && A.cands[0].dist!=null && A.cands[0].dist < 25) elegir(A.cands[0], false); }
  catch(e){ A.err = e.code==="nokey" ? "Falta la clave de Google Maps (Ajustes)." : "Google Maps no respondió: "+e.message; }
  if(!A.ciudad && A.cands.length){ const c = A.cands.find(x=>x.ciudad); if(c) A.ciudad = c.ciudad; }
}
function elegir(c, pintar=true){ const A=S.aca; A.elegido = c; A.dirManual = false; A.geo = null; A.otra = ""; A.nombre = c.nombre; A.direccion = c.direccion; if(c.ciudad) A.ciudad = c.ciudad; if(pintar) render(); }

// ---------- fotos ----------
async function achicar(file, max, q){
  let src; try{ src = await createImageBitmap(file, {imageOrientation:"from-image"}); }catch(e){ src = await new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=URL.createObjectURL(file); }); }
  const k = Math.min(1, max/Math.max(src.width, src.height)); const c = document.createElement("canvas"); c.width=Math.round(src.width*k); c.height=Math.round(src.height*k);
  c.getContext("2d").drawImage(src, 0, 0, c.width, c.height); return c.toDataURL("image/jpeg", q);
}
async function gpsDeFoto(file){
  try{
    const buf = await file.slice(0, 262144).arrayBuffer(); const v = new DataView(buf); if(v.getUint16(0) !== 0xFFD8) return null; let o = 2;
    while(o < v.byteLength - 4){
      const mk = v.getUint16(o), len = v.getUint16(o+2);
      if(mk === 0xFFE1 && v.getUint32(o+4) === 0x45786966){
        const t = o+10, le = v.getUint16(t) === 0x4949, u16 = x=>v.getUint16(x,le), u32 = x=>v.getUint32(x,le);
        const ifd0 = t+u32(t+4), n0 = u16(ifd0); let gps = 0; for(let i=0;i<n0;i++){ const e=ifd0+2+i*12; if(u16(e)===0x8825) gps = t+u32(e+8); } if(!gps) return null;
        const ng = u16(gps), tags = {}; for(let i=0;i<ng;i++){ const e=gps+2+i*12; tags[u16(e)] = {off:e+8}; }
        const ref = k => tags[k] ? String.fromCharCode(v.getUint8(tags[k].off)) : "";
        const rat = k => { if(!tags[k]) return null; const p=t+u32(tags[k].off); const r=j=>u32(p+j*8)/(u32(p+j*8+4)||1); return r(0)+r(1)/60+r(2)/3600; };
        let lat = rat(2), lng = rat(4); if(lat==null || lng==null || (!lat && !lng)) return null; if(ref(1)==="S") lat=-lat; if(ref(3)==="W") lng=-lng;
        return {lat:+lat.toFixed(6), lng:+lng.toFixed(6)};
      }
      if((mk & 0xFF00) !== 0xFF00) break; o += 2+len;
    }
  }catch(e){} return null;
}
async function agregarFotos(files){
  const A = S.aca; let gpsUsado = false;
  for(const f of [...files].slice(0, 10)){
    try{
      if(!gpsUsado){ const g = await gpsDeFoto(f); if(g && (!A.pos || distM(A.pos, g) > 150)){ A.pos = {...g, acc:null, deFoto:true}; A.elegido = null; A.nombre = ""; A.direccion = ""; gpsUsado = true; await sugerir(); toast("Ubicación tomada de la foto"); } }
      let full = await achicar(f, 1280, .72); if(full.length > 600000) full = await achicar(f, 1024, .6);
      const thumb = await achicar(f, 240, .6); A.fotos.push({full, thumb});
    }catch(e){ toast("Una foto no se pudo abrir."); }
  }
  render();
}
$("fCam").onchange = () => { const fs=[...$("fCam").files]; $("fCam").value=""; if(fs.length) agregarFotos(fs); };
$("fGal").onchange = () => { const fs=[...$("fGal").files]; $("fGal").value=""; if(fs.length) agregarFotos(fs); };

// ---------- compartir desde Maps o la galería (share target) ----------
async function revisarCompartido(){
  if(!/[?&]share=1/.test(location.search)) return;
  history.replaceState(null, "", location.pathname);
  let data = null; try{ const c = await caches.open("compartido"); const r = await c.match("ultimo"); if(r){ data = await r.json(); await c.delete("ultimo"); } }catch(e){}
  if(!data) return;
  S.view = "aca"; const A = S.aca;
  if(data.fotos && data.fotos.length){ const files = await Promise.all(data.fotos.map(async u => { const b = await (await fetch(u)).blob(); return new File([b], "f.jpg", {type:b.type}); })); await agregarFotos(files); }
  const txt = [data.title, data.text, data.url].filter(Boolean).join("\n").trim();
  if(txt){ A.compartido = txt; await desdeTextoMaps(txt); }
}
async function desdeTextoMaps(txt){
  const A = S.aca;
  const m = txt.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/) || txt.match(/[?&](?:q|ll|query)=(-?\d+\.\d+)(?:,|%2C)(-?\d+\.\d+)/) || txt.match(/(-?\d{1,2}\.\d{3,})\s*,\s*(-?\d{1,3}\.\d{3,})/);
  if(m){ A.pos = {lat:+m[1], lng:+m[2], acc:null}; }
  const lineas = txt.split(/\n+/).map(x=>x.replace(/https?:\/\/\S+/g,"").trim()).filter(x=>x && !/^-?\d+\.\d+\s*,/.test(x));
  const consulta = lineas.join(", ");
  try{
    if(consulta){ const r = await buscarTexto(consulta, A.pos); if(r[0]){ A.cands = r; elegir(r[0], false); if(!A.pos) A.pos = {lat:r[0].lat, lng:r[0].lng, acc:null}; toast("Lugar desde Maps: "+r[0].nombre); return render(); } }
    if(A.pos){ await sugerir(); return render(); }
    toast("Ese link de Maps no trae el nombre. Abrí Estoy acá en el lugar o buscá el nombre.");
  }catch(e){ toast("Google Maps no respondió."); }
  render();
}

// ---------- vistas ----------
function vistaAca(){
  const A = S.aca;
  const estado = A.buscando ? `<div class="status">Buscando dónde estás…</div>` : A.err ? `<div class="status">${esc(A.err)}</div>` : A.pos ? `<div class="status ok">${A.pos.deFoto?"Ubicación de la foto":"Estás acá"}${A.pos.acc?` (±${A.pos.acc} m)`:""}${A.ciudad?" · "+esc(A.ciudad):""}</div>` : "";
  const cands = A.cands.map((c,i)=>`<button class="cand" data-c="${i}" aria-pressed="${!!(A.elegido&&!A.dirManual&&A.elegido.id===c.id)}"><span><b>${esc(c.nombre)}</b><small>${esc([c.tipo, c.direccion].filter(Boolean).join(" · "))}</small></span>${c.dist!=null?`<span class="d">${c.dist} m</span>`:""}</button>`).join("");
  $("app").innerHTML = `
  <div class="card">
    <div class="row"><button class="btn pri" id="aCam">📷 Sacar foto</button><button class="btn" id="aGal">🖼 Galería</button></div>
    ${A.fotos.length?`<div class="thumbs">${A.fotos.map((f,i)=>`<div class="th"><img src="${f.thumb}" alt="Foto ${i+1}"><button data-delf="${i}" aria-label="Quitar foto">×</button></div>`).join("")}</div>`:""}
    ${estado}
    <div class="row" style="margin-top:8px"><button class="btn" id="aUbi">📍 Actualizar ubicación</button></div>
  </div>
  <div class="card">
    <span class="lbl">¿Dónde están?</span>
    <div class="row"><input id="aBus" class="btn" style="flex:1 1 0;min-width:0;font-weight:400;text-align:left" placeholder="Buscar en Maps por nombre…" enterkeyhint="search"><button class="btn" id="aBusOk" style="flex:none">Buscar</button></div>
    <div class="cands">${cands || (A.pos && !A.buscando ? `<p class="muted">No aparecieron lugares cerca. Escribí el nombre abajo.</p>` : "")}</div>
    <div class="field" style="margin-bottom:0"><label for="aOtra">¿No es ninguna? Escribí otra dirección</label>
      <div class="row"><input id="aOtra" style="flex:1 1 0;min-width:0" value="${esc(A.otra||"")}" placeholder="Via Roma 12, Siena" autocomplete="off" enterkeyhint="done"><button class="btn" id="aOtraOk" style="flex:none">Usar</button></div></div>
    ${A.dirManual && A.direccion ? `<div class="status ok">Dirección elegida: ${esc(A.direccion)}${A.geo && A.geo.lat==null ? " (no la encontré en Maps; se guarda igual)" : ""}</div>` : ""}
  </div>
  <div class="card">
    <div class="field"><label for="aNom">Lugar</label><input id="aNom" value="${esc(A.nombre)}" placeholder="Nombre del local o sitio"></div>
    <div class="field"><label for="aDir">Dirección</label><input id="aDir" value="${esc(A.direccion)}"></div>
    <div class="field"><label for="aCiu">Ciudad</label><input id="aCiu" value="${esc(A.ciudad)}"></div>
    <div class="field"><label for="aNota">Nota</label><textarea id="aNota" rows="3" placeholder="Qué les gustó, qué comieron…">${esc(A.nota)}</textarea></div>
    <button class="btn pri big" id="aSave">Guardar en Estoy acá</button>
  </div>`;
  const sync = () => { if($("aDir").value !== A.direccion) A.dirManual = true; A.otra=$("aOtra").value; A.nombre=$("aNom").value; A.direccion=$("aDir").value; A.ciudad=$("aCiu").value; A.nota=$("aNota").value; };
  for(const id of ["aNom","aDir","aCiu","aNota","aOtra"]) $(id).oninput = sync;
  $("aCam").onclick = () => $("fCam").click(); $("aGal").onclick = () => $("fGal").click();
  $("aUbi").onclick = () => { A.elegido=null; A.dirManual=false; A.geo=null; A.cands=[]; ubicar(); };
  const buscar = async () => { const q=$("aBus").value.trim(); if(!q) return; sync(); try{ A.cands = await buscarTexto(q, A.pos); if(!A.cands.length) toast("Sin resultados."); }catch(e){ toast(e.code==="nokey"?"Falta la clave de Google Maps (Ajustes).":"Google Maps no respondió."); } render(); };
  $("aBusOk").onclick = buscar; $("aBus").onkeydown = e => { if(e.key==="Enter") buscar(); };
  $("app").querySelectorAll("[data-c]").forEach(b => b.onclick = () => { sync(); elegir(A.cands[+b.dataset.c]); });
  $("app").querySelectorAll("[data-delf]").forEach(b => b.onclick = () => { A.fotos.splice(+b.dataset.delf,1); render(); });
  const usarOtra = async () => {
    sync(); const q = A.otra.trim(); if(!q){ $("aOtra").focus(); return; }
    $("aOtraOk").disabled = true;
    const geo = await geocodificar(q, A.pos);
    if(A.elegido && A.nombre === A.elegido.nombre) A.nombre = ""; // el nombre era de la opción que se descarta
    A.elegido = null; A.direccion = q; A.dirManual = true; A.geo = geo; A.ciudad = geo.ciudad || A.ciudad; A.otra = "";
    render();
  };
  $("aOtraOk").onclick = usarOtra; $("aOtra").onkeydown = e => { if(e.key==="Enter") usarOtra(); };
  $("aSave").onclick = guardarLugar;
}
async function guardarLugar(){
  const A = S.aca; const {doc, collection, setDoc, writeBatch, serverTimestamp} = S.fb.fs;
  if(!A.nombre.trim() && !A.direccion.trim() && !A.fotos.length){ toast("Poné el nombre del lugar, una dirección o sacá una foto."); return; }
  $("aSave").disabled = true; $("aSave").textContent = "Guardando…";
  try{
    const ref = doc(collection(S.fb.db, "viajes", S.tripId, "lugares"));
    const dir = A.direccion.trim(), manual = A.dirManual && !!dir;
    const geo = !manual ? null : A.geo?.texto === dir ? A.geo : await geocodificar(consultaDir(dir, A.ciudad.trim()), A.pos);
    const e = manual ? null : A.elegido; const lat = manual ? geo.lat : e?.lat ?? A.pos?.lat ?? null, lng = manual ? geo.lng : e?.lng ?? A.pos?.lng ?? null;
    const lugar = { nombre:A.nombre.trim(), direccion:A.direccion.trim(), ciudad:A.ciudad.trim(), nota:A.nota.trim(), lat, lng,
      placeId:e?.id||"", tipo:e?.tipo||"", maps: manual ? mapsDeDir(consultaDir(dir, A.ciudad.trim())) : e?.maps || (lat!=null?`https://www.google.com/maps/search/?api=1&query=${lat},${lng}`:""),
      fecha:hoyISO(), hora:ahoraHM(), quien:S.user.displayName?.split(" ")[0]||S.user.email, uid:S.user.uid, nFotos:A.fotos.length, thumb:A.fotos[0]?.thumb||"", ts:Date.now(), creado:serverTimestamp() };
    // cada foto en su propio documento (Firestore admite hasta 1 MB por documento)
    const b = writeBatch(S.fb.db); b.set(ref, lugar);
    A.fotos.forEach((f,i) => b.set(doc(collection(S.fb.db, "viajes", S.tripId, "fotos")), {lugarId:ref.id, orden:i, img:f.full, ts:Date.now()}));
    await b.commit();
    toast("Guardado: "+(lugar.nombre||lugar.direccion||"lugar"));
    S.aca = { pos:A.pos, cands:A.cands, elegido:null, fotos:[], nombre:"", direccion:"", ciudad:A.ciudad, nota:"", buscando:false, compartido:"" };
    irA("lugares");
  }catch(err){ toast("No se pudo guardar: "+(err.code||err.message)); $("aSave").disabled=false; $("aSave").textContent="Guardar en Estoy acá"; }
}
function vistaEditar(l){
  $("app").innerHTML = `<div class="card"><h2>Editar lugar</h2>
    <div class="field"><label for="eNom">Lugar</label><input id="eNom" value="${esc(l.nombre)}"></div>
    <div class="field"><label for="eDir">Dirección</label><input id="eDir" value="${esc(l.direccion)}"></div>
    <div class="field"><label for="eCiu">Ciudad</label><input id="eCiu" value="${esc(l.ciudad)}"></div>
    <div class="field"><label for="eNota">Nota</label><textarea id="eNota" rows="3">${esc(l.nota)}</textarea></div>
    <div class="row"><button class="btn" id="eNo">Cancelar</button><button class="btn pri" id="eOk">Guardar cambios</button></div></div>`;
  window.scrollTo(0,0);
  $("eNo").onclick = () => { S.editId = null; render(); };
  $("eOk").onclick = async () => {
    const nombre=$("eNom").value.trim(), direccion=$("eDir").value.trim(), ciudad=$("eCiu").value.trim(), nota=$("eNota").value.trim();
    if(!nombre && !direccion && !l.nFotos){ toast("Poné el nombre del lugar o una dirección."); return; }
    $("eOk").disabled = true; $("eOk").textContent = "Guardando…";
    const cambios = {nombre, direccion, ciudad, nota, editado:Date.now()};
    // si cambió el lugar, el link y las coordenadas viejas ya no sirven
    if(direccion !== (l.direccion||"") || ciudad !== (l.ciudad||"")){
      if(direccion){ const q = consultaDir(direccion, ciudad), g = await geocodificar(q, null); Object.assign(cambios, {lat:g.lat, lng:g.lng, placeId:"", tipo:"", maps:mapsDeDir(q)}); }
      else Object.assign(cambios, {placeId:"", tipo:""});
    }
    const {doc, updateDoc} = S.fb.fs; const fin = () => { toast("Cambios guardados"); S.editId = null; render(); };
    const falla = err => { toast("No se pudo guardar: "+(err.code||err.message)); if($("eOk")){ $("eOk").disabled=false; $("eOk").textContent="Guardar cambios"; } };
    const p = updateDoc(doc(S.fb.db, "viajes", S.tripId, "lugares", l.id), cambios);
    // sin señal Firestore lo deja en cola y recién confirma al reconectarse: no hay que quedarse esperando
    if(navigator.onLine){ try{ await p; fin(); }catch(err){ falla(err); } } else { p.catch(falla); fin(); }
  };
}
function vistaLugares(){
  if(S.editId){ const l = S.lugares.find(x=>x.id===S.editId); if(l) return vistaEditar(l); S.editId = null; }
  if(!S.lugares.length){ $("app").innerHTML = `<div class="card"><p class="muted">Todavía no guardaron lugares. Tocá 📍 Estoy acá.</p></div>`; return; }
  const marca = ls.get("exportadoHasta") || 0, nuevos = S.lugares.filter(l => Math.max(l.ts||0, l.editado||0) > marca).length;
  let html = `<div class="card"><h2>Pasar a Italia 2026</h2><p class="muted">Copiá los lugares y, en Italia 2026, andá a Lugares → Pegar desde Estoy acá.</p>
    <div class="row"><button class="btn pri" id="expNuevos" ${nuevos?"":"disabled"}>Copiar nuevos (${nuevos})</button><button class="btn" id="expTodos">Copiar todos</button></div>
    ${S.exportTxt?`<div class="field"><label for="expTxt">No se pudo copiar solo: seleccioná este texto y copialo</label><textarea id="expTxt" rows="4" readonly>${esc(S.exportTxt)}</textarea></div>`:""}</div>`, dia = "";
  for(const l of S.lugares){
    if(l.fecha !== dia){ dia = l.fecha; html += `<div class="day">${esc(new Date(dia+"T12:00").toLocaleDateString("es-AR",{weekday:"long", day:"numeric", month:"long"}))}</div>`; }
    html += `<div class="card lug">${l.thumb?`<img src="${l.thumb}" alt="">`:`<div class="ph">📍</div>`}<div style="flex:1;min-width:0"><h3>${esc(l.nombre||l.direccion||"Sin nombre")}</h3>
      <div class="muted">${esc([l.direccion, l.ciudad].filter(Boolean).join(" · "))}</div><div class="muted">${esc(l.hora||"")} · ${esc(l.quien||"")}${l.nFotos?` · ${l.nFotos} foto${l.nFotos>1?"s":""}`:""}</div>
      ${l.nota?`<p style="margin:.4em 0 0">${esc(l.nota)}</p>`:""}<div class="row" style="margin-top:8px">${l.maps?`<a class="btn" style="flex:none;min-height:38px;padding:6px 12px" href="${esc(l.maps)}" target="_blank" rel="noopener">Abrir en Maps</a>`:""}<button class="btn" style="flex:none;min-height:38px;padding:6px 12px" data-edit="${esc(l.id)}">✏️ Editar</button></div></div></div>`;
  }
  $("app").innerHTML = html;
  $("app").querySelectorAll("[data-edit]").forEach(b => b.onclick = () => { S.editId = b.dataset.edit; render(); });
  if($("expNuevos")) $("expNuevos").onclick = () => exportarLugares(false);
  if($("expTodos")) $("expTodos").onclick = () => exportarLugares(true);
}
// la marca se guarda en este celular; "Copiar todos" sirve si algo no se llegó a pegar
async function exportarLugares(todos){
  const marca = ls.get("exportadoHasta") || 0, ahora = Date.now();
  const xs = S.lugares.filter(l => todos || Math.max(l.ts||0, l.editado||0) > marca);
  if(!xs.length){ toast("No hay lugares para copiar."); return; }
  const txt = JSON.stringify({tipo:"estoy-aca", v:1, lugares:xs.map(l => ({id:l.id, nombre:l.nombre||"", direccion:l.direccion||"", ciudad:l.ciudad||"", nota:l.nota||"", fecha:l.fecha||"", hora:l.hora||"", lat:l.lat??null, lng:l.lng??null, maps:l.maps||"", quien:l.quien||"", thumb:l.thumb||"", editado:l.editado||l.ts||0}))});
  try{ await navigator.clipboard.writeText(txt); S.exportTxt = ""; ls.set("exportadoHasta", ahora); toast(`${xs.length} lugar${xs.length>1?"es":""} copiado${xs.length>1?"s":""}. Pegalos en Italia 2026.`); }
  catch(e){ S.exportTxt = txt; ls.set("exportadoHasta", ahora); }
  render();
}
function vistaAjustes(){
  const cfg = ls.get("cfg")||{};
  const link = location.origin + location.pathname + "#cfg=" + btoa(unescape(encodeURIComponent(JSON.stringify({firebase:cfg.firebase, maps:cfg.maps}))));
  $("app").innerHTML = `<div class="card"><h2>Viaje</h2><p class="muted">${esc(S.trip?.nombre)} · ${esc((S.trip?.emails||[]).join(", "))}</p></div>
  <div class="card"><h2>Invitar a otro celular</h2><p class="muted">Mandale este link a Rosana por WhatsApp. Al abrirlo, la app queda configurada; después entra con su cuenta de Google. Solo pueden entrar los mails del viaje.</p>
    <button class="btn" id="cpLink">Copiar link de configuración</button></div>
  <div class="card"><h2>Instalar</h2><p class="muted">En Chrome: menú ⋮ → <b>Instalar app</b> (o Agregar a pantalla principal). Instalada, aparece en el menú <b>Compartir</b> de Maps y de la galería.</p></div>
  <div class="card"><div class="field"><label for="kMaps">Clave de Google Maps</label><input id="kMaps" value="${esc(cfg.maps||"")}" autocomplete="off"></div><button class="btn" id="kOk">Guardar clave</button></div>
  <div class="card"><button class="btn" id="salir">Salir de la cuenta</button></div>`;
  $("cpLink").onclick = async () => { try{ await navigator.clipboard.writeText(link); toast("Link copiado"); }catch(e){ prompt("Copiá este link", link); } };
  $("kOk").onclick = () => { cfg.maps = $("kMaps").value.trim(); ls.set("cfg", cfg); S.mapsKey = cfg.maps; toast("Clave guardada"); };
  $("salir").onclick = () => S.fb.auth.signOut(S.fb.a);
}

// ---------- arranque ----------
leerConfigDeLink();
const cfg = ls.get("cfg");
if(!cfg || !cfg.firebase) pantallaConfig(); else iniciarFirebase(cfg).catch(e => { $("app").innerHTML = `<div class="card"><h2>No se pudo iniciar</h2><pre>${esc(e.message)}</pre><button class="btn" onclick="localStorage.removeItem('cfg');location.reload()">Volver a configurar</button></div>`; });
</script>
